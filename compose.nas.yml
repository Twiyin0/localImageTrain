services:
  wd-tagger-api:
    image: localimagetrain-wd-tagger-api
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wd-tagger-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.nas
    environment:
      HF_HOME: /app/.cache/huggingface
      WD_TAGGER_MODELS_DIR: /app/models
      WD_TAGGER_PROVIDERS: CPUExecutionProvider
      WD_TAGGER_REPO_ID: SmilingWolf/wd-convnext-tagger-v3
    volumes:
      - ./.cache:/app/.cache
      - /opt/python/huggingface/localImageTrain/models:/app/models

  wd-tagger-webui:
    image: localimagetrain-wd-tagger-webui
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: wd-tagger-webui
    restart: unless-stopped
    ports:
      - "7861:7861"
    env_file:
      - .env.nas
    environment:
      PORT: 7861
      WD_TAGGER_API_URL: http://wd-tagger-api:8000
      WD_TAGGER_WEBUI_TIMEOUT_MS: 600000
    depends_on:
      - wd-tagger-api
