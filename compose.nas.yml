services:
  wd-tagger-api:
    image: localimagetrain-wd-tagger-api
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wd-tagger-api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "7861:8000"
    env_file:
      - .env.nas
    environment:
      HF_HOME: /app/.cache/huggingface
      WD_TAGGER_MODELS_DIR: /app/models
      WD_TAGGER_PROVIDERS: CPUExecutionProvider
      WD_TAGGER_REPO_ID: SmilingWolf/wd-convnext-tagger-v3
    volumes:
      - /opt/python/huggingface/localImageTrain:/app
      - /opt/python/huggingface/localImageTrain/.cache:/app/.cache
      - /opt/python/huggingface/localImageTrain/models:/app/models
      - /opt/python/huggingface/localImageTrain/outputs:/app/outputs
